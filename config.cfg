[bot]
SQLITE_DB_PATH = your-database-path
BOT_TOKEN = your-discord-bot-token
DOWNLOAD_FILES = no
DOWNLOAD_DIR = your-download-dir
NOTIFICATION_CHANNEL = your-discord-channel-id
UPDATE_MINUTES = 90
RANDOMIZE_UPDATE_INTERVAL = yes

[moodle]
API_TOKEN = your-api-token
DOMAIN = your-moodle-host
USER_ID = your-user-id

[embeds]
FILES_PER_PAGE = 10
DISCUSSIONS_PER_PAGE = 10
FILES_PER_EMBED = 5
LINKS_PER_EMBED = 5
DISCUSSIONS_PER_EMBED = 5
ATTACHMENTS_PER_EMBED = 5
DISCUSSION_LINES_PER_EMBED = 10

[embeds.colors]
# use color hex values
FILE_EMBED_COLOR = 0xfcca00
LINK_EMBED_COLOR = 0x16f2ac
ASSIGNMENT_EMBED_COLOR = 0x5f0e80
DISCUSSION_EMBED_COLOR = 0x2afc00
ATTACHMENT_EMBED_COLOR = 0xfcca66
FORUM_EMBED_COLOR = 0xfcfcfc
QUIZ_EMBED_COLOR = 0x00cefc
PAGE_EMBED_COLOR = 0x00a000
WORKSHOP_EMBED_COLOR = 0xf4fc00
INVALID_TOKEN_EMBED_COLOR = 0xff0000